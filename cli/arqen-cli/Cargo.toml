[package]
name = "arqen-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Arqen CLI for generating and running applications"

[[bin]]
name = "arqen"
path = "src/main.rs"

[dependencies]
arqen-core.workspace = true
arqen-http.workspace = true
arqen-thingd.workspace = true
arqen-jobs.workspace = true
arqen-logging.workspace = true
clap = { version = "4", features = ["derive"] }
tokio.workspace = true
tracing.workspace = true
serde_json.workspace = true
anyhow = "1"
