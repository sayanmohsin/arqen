[workspace]
resolver = "2"
exclude = ["examples/minimal-api", "examples/memory-backend"]
members = [
    "crates/arqen",
    "cli/arqen-cli",
]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/sayanmohsin/arqen"
homepage = "https://sayanmohsin.github.io/arqen/"
keywords = ["backend", "agents", "automation", "axum", "thingd"]
categories = ["web-programming", "command-line-utilities"]

[workspace.dependencies]
arqen = { path = "crates/arqen" }
tokio = { version = "1", features = ["full"] }
axum = { version = "0.7", features = ["macros"] }
tower = "0.4"
tower-http = { version = "0.6", features = ["cors", "limit", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
async-trait = "0.1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"] }
thingd = { version = "0.72", features = ["persistent", "search"] }
