name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm
          echo "LLVM_CONFIG_PATH=$(command -v llvm-config)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - run: cargo fmt --all -- --check
      - run: cargo check --workspace --all-features
      - name: Clippy default features without warnings
        run: cargo clippy -p arqen --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo doc --workspace --no-deps
      - run: cargo package --package arqen --allow-dirty --no-verify
      - run: cargo bench --bench framework --no-run
      - name: Check examples
        run: |
          cargo check --manifest-path examples/memory-backend/Cargo.toml
          cargo check --manifest-path examples/minimal-api/Cargo.toml
