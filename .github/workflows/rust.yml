name: Rust

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --package arqen -- --check
      - run: cargo check --package arqen --all-features
      - run: cargo clippy --package arqen --all-targets --all-features -- -D warnings
      - run: cargo test --package arqen --all-features
