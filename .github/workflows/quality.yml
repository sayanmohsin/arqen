name: Documentation and dependency quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  release-version:
    name: Release version ownership
    if: ${{ github.event_name == 'pull_request' && !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject manual release version changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          base_package_version=$(git show "${BASE_SHA}:crates/arqen/Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
          head_package_version=$(git show "${HEAD_SHA}:crates/arqen/Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n 1)
          base_manifest_version=$(git show "${BASE_SHA}:.release-please-manifest.json" | jq -r '."crates/arqen"')
          head_manifest_version=$(git show "${HEAD_SHA}:.release-please-manifest.json" | jq -r '."crates/arqen"')

          if [[ "$base_package_version" != "$head_package_version" || "$base_manifest_version" != "$head_manifest_version" ]]; then
            echo "Arqen release versions are owned by Release Please."
            echo "Do not change crates/arqen/Cargo.toml or .release-please-manifest.json in a feature, fix, or performance PR."
            echo "Create the release PR through the Release workflow instead."
            echo "Base: Cargo $base_package_version / manifest $base_manifest_version"
            echo "Head: Cargo $head_package_version / manifest $head_manifest_version"
            exit 1
          fi

  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with: { globs: "**/*.md" }
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --verbose --no-progress --exclude '127\.0\.0\.1' --exclude 'github.com/.*/compare/' --exclude 'github.com/login' --exclude 'github.com/.*/security/advisories/new' --exclude 'github.com/.*/issues/new' "**/*.md" "README.md"
          fail: true

  prettier:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm format:check
        working-directory: docs

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/audit@v1
        # thingd 0.84.2 transitively enables sqlx-mysql/rsa. RustSec has no
        # fixed rsa release for RUSTSEC-2023-0071; retain the audit result as
        # an explicit, reviewed exception until thingd removes that path.
        with:
          ignore: RUSTSEC-2023-0071
      - uses: pnpm/action-setup@v6
        with: { version: 10 }
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: docs/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: docs
      - run: pnpm audit --audit-level high
        working-directory: docs
