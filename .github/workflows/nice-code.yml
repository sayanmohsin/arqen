name: Nice Code

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: Run Nice Code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          path: arqen
      - uses: actions/checkout@v7
        with:
          repository: sayanmohsin/nice-code
          path: nice-code
          ref: v0.1.11
      - uses: dtolnay/rust-toolchain@stable
      - name: Build Nice Code engine
        run: cargo build --release --manifest-path nice-code/engine/Cargo.toml
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Run Nice Code
        working-directory: arqen
        env:
          NICE_CODE_DIR: ${{ github.workspace }}/nice-code
          NICE_CODE_ENGINE: ${{ github.workspace }}/nice-code/engine/target/release/nice-code-engine
        run: bash scripts/check-nice-code.sh
