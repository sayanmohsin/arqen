name: Release crates

on:
  push:
    tags:
      - "arqen-v*"
  workflow_dispatch:

concurrency:
  group: crates-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify publishable workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo package --package arqen --no-verify

  publish:
    name: Publish arqen to crates.io
    needs: verify
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crates if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          set -euo pipefail

          VERSION=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "arqen") | .version')
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "arqen-v${VERSION}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match workspace version $VERSION"
            exit 1
          fi

          publish_if_missing() {
            local crate="$1"
            if curl -fsS "https://crates.io/api/v1/crates/${crate}/${VERSION}" >/dev/null; then
              echo "${crate} ${VERSION} already exists"
              return
            fi

            cargo publish -p "$crate" --token "$CARGO_REGISTRY_TOKEN"
            sleep 30
          }

          publish_if_missing arqen
