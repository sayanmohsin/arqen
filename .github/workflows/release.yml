name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Existing Arqen version to retry, for example 0.15.0"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Create or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.releases_created || steps.manual.outputs.release_created }}
      retry: ${{ steps.manual.outputs.retry }}
      version: ${{ steps.release.outputs['crates/arqen--version'] || steps.manual.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install release audit dependencies
        run: sudo apt-get update && sudo apt-get install -y jq ripgrep
      - name: Audit release documentation and legacy terms
        run: bash scripts/check-release-docs.sh
      - name: Check if release already exists
        id: check-release
        if: ${{ inputs.publish_version == '' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(jq -r '."crates/arqen"' .release-please-manifest.json)
          if gh release view "arqen-v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release arqen-v${VERSION} already exists - skipping Release Please"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Create release App token
        id: app-token
        if: ${{ inputs.publish_version == '' && steps.check-release.outputs.exists != 'true' }}
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: arqen
      - name: Run Release Please
        id: release
        if: ${{ inputs.publish_version == '' && steps.check-release.outputs.exists != 'true' }}
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Synchronize release metadata on release PR
        if: ${{ steps.release.outputs.prs_created == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RELEASE_PR: ${{ steps.release.outputs.pr }}
        run: |
          PR_NUMBER=$(echo "$RELEASE_PR" | jq -r '.number')
          BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          VERSION=$(sed -n 's/^version = "\([^"]*\)"/\1/p' crates/arqen/Cargo.toml | head -n 1)
          bash scripts/sync-release-docs.sh "$VERSION"
          cargo update -w
          git add Cargo.lock
          git add Cargo.toml README.md CHANGELOG.md docs/getting-started.md docs/testing.md docs/troubleshooting.md
          if ! git diff --cached --quiet; then
            git commit -m "chore: synchronize release metadata"
            git push origin "$BRANCH"
          fi
      - name: Normalize manual retry
        id: manual
        if: ${{ inputs.publish_version != '' }}
        env:
          VERSION: ${{ inputs.publish_version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_version must be a full SemVer value" >&2
            exit 1
          fi
          {
            echo "release_created=true"
            echo "retry=true"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  crates-publish:
    name: Publish arqen to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: arqen-v${{ needs.release-please.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Install LLVM and Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm
          echo "LLVM_CONFIG_PATH=$(command -v llvm-config)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib/llvm-* -name libclang.so -print -quit)")" >> "$GITHUB_ENV"
      - name: Publish crate if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if curl -fsS -A "arqen-release/${GITHUB_REPOSITORY} run/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/arqen/${VERSION}" >/dev/null; then
            echo "arqen ${VERSION} already exists"
          else
            cargo publish -p arqen --token "$CARGO_REGISTRY_TOKEN"
          fi
