name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_version:
        description: "Existing Arqen version to retry, for example 0.2.0"
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    name: Create or finalize release PR
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created || steps.manual.outputs.release_created }}
      retry: ${{ steps.manual.outputs.retry }}
      version: ${{ steps.release.outputs.version || steps.manual.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create release App token
        id: app-token
        if: ${{ inputs.publish_version == '' }}
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: arqen
      - name: Run Release Please
        id: release
        if: ${{ inputs.publish_version == '' }}
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - name: Update Cargo.lock on release PR
        if: ${{ steps.release.outputs.pr-number != '' }}
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          PR_NUMBER="${{ steps.release.outputs.pr-number }}"
          BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.head.ref')
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$BRANCH"
          git checkout "$BRANCH"
          cargo update -w
          git add Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore: update Cargo.lock"
            git push origin "$BRANCH"
          fi
      - name: Normalize manual retry
        id: manual
        if: ${{ inputs.publish_version != '' }}
        env:
          VERSION: ${{ inputs.publish_version }}
        run: |
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "publish_version must be a full SemVer value" >&2
            exit 1
          fi
          {
            echo "release_created=true"
            echo "retry=true"
            echo "version=$VERSION"
          } >> "$GITHUB_OUTPUT"

  crates-publish:
    name: Publish arqen to crates.io
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || needs.release-please.outputs.retry == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: arqen-v${{ needs.release-please.outputs.version }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Publish crate if missing
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          if curl -fsS -A "arqen-release/${GITHUB_REPOSITORY} run/${GITHUB_RUN_ID}" \
            "https://crates.io/api/v1/crates/arqen/${VERSION}" >/dev/null; then
            echo "arqen ${VERSION} already exists"
          else
            cargo publish -p arqen --token "$CARGO_REGISTRY_TOKEN"
          fi
