name: Docker smoke

on:
  pull_request:
    paths: ["Dockerfile", "docker-compose.yml", "Cargo.toml", "Cargo.lock", "crates/**", "cli/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Dockerfile builds from the /ancatag parent so Compose can resolve
      # the repository's documented Dockerfile path.
      - run: docker compose config
