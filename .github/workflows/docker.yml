name: Docker smoke

on:
  pull_request:
    paths: ["Dockerfile", "docker-compose.yml", "Cargo.toml", "Cargo.lock", "crates/**"]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Validate compose config
        run: docker compose config
      - name: Build arqen image
        run: docker compose build arqen
      - name: Start compose stack
        run: docker compose up -d
      - name: Wait for arqen health
        run: |
          for i in $(seq 1 90); do
            if curl -sf http://127.0.0.1:8888/health >/dev/null 2>&1; then
              echo "arqen healthy after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "arqen did not become healthy" >&2
          docker compose logs arqen
          exit 1
      - name: Smoke agent manifest
        run: curl -sf http://127.0.0.1:8888/agent/manifest | grep -q 'arqen'
      - name: Stop stack
        if: always()
        run: docker compose down -v
