[package]
name = "watchloom"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Watchloom - a backend app built with Arqen"

[[bin]]
name = "watchloom"
path = "src/main.rs"

[dependencies]
arqen = { path = "../crates/arqen", features = ["http-server", "thingd-native", "logging"] }
async-trait = "0.1"
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
reqwest = { version = "0.13", features = ["json"] }
