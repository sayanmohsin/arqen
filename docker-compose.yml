services:
  arqen:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    # The CLI is flag-driven (see the Dockerfile CMD); these vars mirror the
    # canonical ARQEN_* config names for library/config consumers.
    environment:
      - ARQEN_LOG_LEVEL=info
    volumes:
      - arqen_data:/data
    restart: unless-stopped

  # Standalone thingd sidecar. Note: the current `arqen start` binary does not
  # read ARQEN_THINGD_URL, so arqen runs on in-memory storage; thingd is
  # available here for sidecar-style local development.
  thingd:
    image: sayanmohsin/thingd:latest
    ports:
      - "8757:8757"
    volumes:
      - thingd_data:/data
    environment:
      - THINGD_PATH=/data/thingd.db
      - THINGD_DRIVER=native
      - THINGD_HOST=0.0.0.0
      - THINGD_PORT=8757
      - THINGD_AUTH_TOKEN=${THINGD_AUTH_TOKEN:-dev-token}
    restart: unless-stopped

volumes:
  arqen_data:
  thingd_data:
