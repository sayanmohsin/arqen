services:
  arqen:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8888:8888"
    # Production startup is intentionally strict: use the thingd HTTP sidecar,
    # structured logs, and an explicit development JWT secret for this smoke
    # environment. Replace the secret in real deployments.
    environment:
      - ARQEN_LOG_LEVEL=info
      - ARQEN_LOG_FORMAT=json
      - ARQEN_STORAGE_MODE=http
      - ARQEN_THINGD_URL=http://thingd:8757
      - ARQEN_THINGD_AUTH_TOKEN=${THINGD_AUTH_TOKEN:-dev-token}
      - ARQEN_JWT_SECRET=${ARQEN_JWT_SECRET:-arqen-docker-smoke-secret}
    volumes:
      - arqen_data:/data
    restart: unless-stopped

  # Standalone thingd sidecar used by the production-style Arqen smoke test.
  thingd:
    image: sayanmohsin/thingd:latest
    ports:
      - "8757:8757"
    volumes:
      - thingd_data:/data
    environment:
      - THINGD_PATH=/data/thingd.db
      - THINGD_DRIVER=native
      - THINGD_HOST=0.0.0.0
      - THINGD_PORT=8757
      - THINGD_AUTH_TOKEN=${THINGD_AUTH_TOKEN:-dev-token}
    restart: unless-stopped

volumes:
  arqen_data:
  thingd_data:
