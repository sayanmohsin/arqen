<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 48" role="img" aria-labelledby="title desc">
  <title id="title">{arqen}</title>
  <desc id="desc">Arqen logo with neon blue curly braces and a monospace wordmark.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8af7ff"/>
      <stop offset="0.5" stop-color="#00d9ff"/>
      <stop offset="1" stop-color="#0077ff"/>
    </linearGradient>
  </defs>
  <rect width="220" height="48" rx="8" fill="#080a0d"/>
  <text x="8" y="33" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="27" font-weight="700" letter-spacing="0.5"><tspan fill="url(#accent)">{</tspan><tspan fill="#f5f7fa">arqen</tspan><tspan fill="url(#accent)">}</tspan></text>
</svg>
