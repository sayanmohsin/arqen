[package]
name = "arqen"
version = "0.2.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
description = "Backend infrastructure for agent-ready applications"
readme = "../../README.md"

[features]
default = ["http-server", "thingd-native"]
http-server = ["dep:axum", "dep:tower", "dep:tower-http"]
http-client = ["dep:reqwest"]
thingd-native = ["dep:thingd"]
logging = ["dep:tracing-subscriber"]
test-util = ["dep:tower"]

[dependencies]
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"], optional = true }
chrono = { version = "0.4", features = ["serde"] }
reqwest = { version = "0.12", features = ["json"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thingd = { version = "0.73", optional = true }
thiserror = "1"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.4", features = ["util"], optional = true }
tower-http = { version = "0.6", features = ["limit"], optional = true }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"], optional = true }
uuid = { version = "1", features = ["v4"] }
